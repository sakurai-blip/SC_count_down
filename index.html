<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="theme-color"
      content="#f5f5f7">

<title>支援士カウントダウン</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f7;
  color: #1d1d1f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 24px 16px 45px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.subtitle {
  color: #86868b;
  font-size: 13px;
  margin-bottom: 5px;
}

.days {
  font-size: 64px;
  line-height: .95;
  font-weight: 800;
  letter-spacing: -4px;
}

.days-label {
  font-size: 17px;
  font-weight: 700;
  margin-top: 7px;
}

.exam-date {
  color: #86868b;
  font-size: 12px;
  margin-top: 5px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.045);
}

.card-title {
  color: #86868b;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
}

.remaining {
  font-size: 34px;
  font-weight: 800;
}

.remaining span {
  font-size: 17px;
  font-weight: 600;
}

.required {
  margin-top: 4px;
  font-size: 13px;
  color: #666;
}

.progress {
  height: 8px;
  background: #e5e5ea;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 13px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #007aff;
  border-radius: 20px;
}

.progress-text {
  margin-top: 7px;
  color: #86868b;
  font-size: 12px;
}

.pace-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.pace {
  background: #f5f5f7;
  border-radius: 13px;
  padding: 11px 4px;
  text-align: center;
}

.pace-number {
  font-size: 23px;
  font-weight: 800;
}

.pace-label {
  font-size: 11px;
  color: #777;
  margin-top: 2px;
}

.pace-result {
  font-size: 11px;
  color: #555;
  margin-top: 6px;
  line-height: 1.35;
}

.today-card {
  text-align: center;
}

.today-number {
  font-size: 54px;
  font-weight: 800;
  line-height: 1;
  margin: 4px 0 9px;
}

.today-label {
  color: #86868b;
  font-size: 12px;
  margin-bottom: 14px;
}

.buttons {
  display: flex;
  gap: 7px;
}

button {
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  padding: 12px;
  cursor: pointer;
}

.add {
  flex: 1;
  background: #007aff;
  color: white;
}

.minus,
.reset {
  width: 50px;
  background: #e5e5ea;
}

.status {
  min-height: 20px;
  margin-top: 11px;
  font-size: 13px;
  font-weight: 700;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}

.summary-item {
  background: #f5f5f7;
  border-radius: 13px;
  padding: 12px;
}

.summary-number {
  font-size: 23px;
  font-weight: 800;
}

.summary-label {
  color: #86868b;
  font-size: 11px;
  margin-top: 3px;
}

.pace-status {
  margin-top: 10px;
  padding: 11px;
  border-radius: 12px;
  background: #f5f5f7;
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
  font-weight: 600;
}

details {
  background: white;
  border-radius: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.045);
  overflow: hidden;
}

summary {
  list-style: none;
  cursor: pointer;
  padding: 17px 18px;
  font-size: 14px;
  font-weight: 700;
}

summary::-webkit-details-marker {
  display: none;
}

summary::after {
  content: "＋";
  float: right;
  color: #86868b;
  font-size: 18px;
}

details[open] summary::after {
  content: "−";
}

.history-content {
  padding: 0 18px 18px;
}

.history-header {
  color: #86868b;
  font-size: 11px;
  margin-bottom: 12px;
}

.month-title {
  font-size: 13px;
  font-weight: 700;
  padding: 12px 0 6px;
}

.history-row {
  display: grid;
  grid-template-columns: 1fr 68px 50px;
  align-items: center;
  gap: 7px;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.history-date {
  font-size: 13px;
  font-weight: 600;
}

.history-date span {
  display: block;
  color: #999;
  font-size: 10px;
  margin-top: 2px;
}

.history-input {
  width: 68px;
  text-align: center;
  padding: 8px 3px;
  border: 1px solid #d2d2d7;
  border-radius: 10px;
  font-size: 14px;
}

.history-save {
  background: #e5e5ea;
  padding: 8px 4px;
  font-size: 11px;
}

.settings {
  display: grid;
  gap: 11px;
}

label {
  display: block;
  color: #666;
  font-size: 12px;
  margin-bottom: 4px;
}

input {
  width: 100%;
  border: 1px solid #d2d2d7;
  border-radius: 11px;
  padding: 11px;
  font-size: 15px;
  background: white;
}

.save {
  width: 100%;
  background: #1d1d1f;
  color: white;
}

.update-button {
  width: 100%;
  background: #007aff;
  color: white;
}

.version {
  text-align: center;
  color: #999;
  font-size: 11px;
  margin-top: 4px;
}

.message {
  text-align: center;
  color: #34c759;
  font-size: 12px;
  min-height: 18px;
  margin-top: 8px;
}

.note {
  text-align: center;
  color: #999;
  font-size: 10px;
  line-height: 1.6;
  margin-top: 18px;
}

@media (max-width: 360px) {

  .days {
    font-size: 58px;
  }

  .history-row {
    grid-template-columns: 1fr 60px 47px;
  }

  .history-input {
    width: 60px;
  }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

  <div class="subtitle">
    情報処理安全確保支援士
  </div>

  <div class="days" id="days">
    --
  </div>

  <div class="days-label">
    試験まで
  </div>

  <div class="exam-date" id="examDateText">
    試験日：----
  </div>

</div>


<div class="card">

  <div class="card-title">
    午後問題
  </div>

  <div class="remaining">

    <span>残り</span>

    <span id="remaining">
      140
    </span>

    <span>問</span>

  </div>

  <div class="required">

    必要ペース：
    <strong id="requiredRate">
      --
    </strong>
    問 / 日

  </div>

  <div class="progress">

    <div
      class="progress-bar"
      id="progressBar">
    </div>

  </div>

  <div class="progress-text">

    完了：
    <strong id="completed">
      0
    </strong>
    問

  </div>

</div>


<div class="card">

  <div class="card-title">
    このペースなら
  </div>

  <div class="pace-grid">

    <div class="pace">

      <div class="pace-number">
        1
      </div>

      <div class="pace-label">
        1問 / 日
      </div>

      <div
        class="pace-result"
        id="pace1">
        --
      </div>

    </div>


    <div class="pace">

      <div class="pace-number">
        2
      </div>

      <div class="pace-label">
        2問 / 日
      </div>

      <div
        class="pace-result"
        id="pace2">
        --
      </div>

    </div>


    <div class="pace">

      <div class="pace-number">
        3
      </div>

      <div class="pace-label">
        3問 / 日
      </div>

      <div
        class="pace-result"
        id="pace3">
        --
      </div>

    </div>

  </div>

</div>


<div class="card today-card">

  <div class="card-title">
    今日
  </div>

  <div class="today-number">

    <span id="today">
      0
    </span>

    <span style="font-size:20px;">
      問
    </span>

  </div>

  <div class="today-label">

    最低 1問　・　目標 2問　・　理想 3問

  </div>

  <div class="buttons">

    <button
      class="minus"
      onclick="changeToday(-1)">
      −
    </button>

    <button
      class="add"
      onclick="changeToday(1)">
      ＋ 1問やった
    </button>

    <button
      class="reset"
      onclick="resetToday()">
      ↺
    </button>

  </div>

  <div
    class="status"
    id="status">
    まずは1問。
  </div>

</div>


<div class="card">

  <div class="card-title">
    学習状況
  </div>

  <div class="summary-grid">

    <div class="summary-item">

      <div
        class="summary-number"
        id="summaryCompleted">
        0
      </div>

      <div class="summary-label">
        累計
      </div>

    </div>


    <div class="summary-item">

      <div
        class="summary-number"
        id="summaryAverage">
        0.00
      </div>

      <div class="summary-label">
        1日平均
      </div>

    </div>


    <div class="summary-item">

      <div
        class="summary-number"
        id="summaryGoalDays">
        0
      </div>

      <div class="summary-label">
        2問以上の日
      </div>

    </div>


    <div class="summary-item">

      <div
        class="summary-number"
        id="summaryNeeded">
        --
      </div>

      <div class="summary-label">
        必要ペース
      </div>

    </div>

  </div>

  <div
    class="pace-status"
    id="paceStatus">
    --
  </div>

</div>


<details>

  <summary>
    学習履歴
  </summary>

  <div class="history-content">

    <div class="history-header">

      過去の記録を修正する場合は、
      数字を変更して「保存」

    </div>

    <div id="historyList"></div>

  </div>

</details>


<details>

  <summary>
    設定
  </summary>

  <div class="history-content">

    <div class="settings">

      <div>

        <label for="examInput">
          試験日
        </label>

        <input
          type="date"
          id="examInput">

      </div>


      <div>

        <label for="remainingInput">
          最初の問題数
        </label>

        <input
          type="number"
          id="remainingInput"
          min="0">

      </div>


      <button
        class="save"
        onclick="saveSettings()">
        設定を保存
      </button>


      <button
        class="update-button"
        onclick="updateApp()">
        ↻ 最新版に更新
      </button>


      <div
        class="version"
        id="version">
        アプリ v1.2
      </div>

    </div>

    <div
      class="message"
      id="message">
    </div>

  </div>

</details>


<div class="note">

  学習記録はこの端末のブラウザに保存されます。<br>
  サーバーには学習記録を送信しません。

</div>

</div>


<script>

/* ==================================================
   アプリバージョン
================================================== */

const APP_VERSION = "1.4";


/* ==================================================
   初期設定
================================================== */

const DEFAULT_EXAM =
  "2026-11-08";

const DEFAULT_REMAINING =
  140;


/* ==================================================
   データ読み込み
================================================== */

let data = {};

try {

  data =
    JSON.parse(
      localStorage.getItem(
        "shien士Countdown"
      )
    ) || {};

} catch (e) {

  data = {};

}


/* ==================================================
   初期値
================================================== */

if (!data.exam) {

  data.exam =
    DEFAULT_EXAM;

}

if (
  typeof data.initialRemaining !==
  "number"
) {

  if (
    typeof data.remaining ===
    "number"
  ) {

    data.initialRemaining =
      data.remaining;

  } else {

    data.initialRemaining =
      DEFAULT_REMAINING;

  }

}

if (!data.history) {

  data.history = {};

}


/* ==================================================
   保存
================================================== */

function saveData() {

  localStorage.setItem(
    "shien士Countdown",
    JSON.stringify(data)
  );

}


/* ==================================================
   最新版に更新
================================================== */

function updateApp() {

  const url =
    new URL(
      window.location.href
    );

  url.searchParams.set(
    "v",
    Date.now()
  );

  window.location.href =
    url.toString();

}


/* ==================================================
   日付キー
================================================== */

function getDateKey(
  date = new Date()
) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}


/* ==================================================
   日付表示
================================================== */

function formatDate(key) {

  const parts =
    key.split("-");

  return (
    Number(parts[1]) +
    "/" +
    Number(parts[2])
  );

}


/* ==================================================
   曜日
================================================== */

function getWeekday(key) {

  const date =
    new Date(
      key +
      "T00:00:00"
    );

  const weekdays = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];

  return weekdays[
    date.getDay()
  ];

}


/* ==================================================
   日数
================================================== */

function getDaysRemaining() {

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const exam =
    new Date(
      data.exam +
      "T00:00:00"
    );

  const diff =
    exam.getTime() -
    today.getTime();

  return Math.max(
    Math.ceil(
      diff /
      (1000 * 60 * 60 * 24)
    ),
    0
  );

}


/* ==================================================
   累計
================================================== */

function getCompleted() {

  let total = 0;

  for (
    const key in data.history
  ) {

    const value =
      Number(
        data.history[key]
      );

    if (
      Number.isFinite(value) &&
      value > 0
    ) {

      total +=
        Math.floor(value);

    }

  }

  return total;

}


/* ==================================================
   残り
================================================== */

function getRemaining() {

  return Math.max(
    data.initialRemaining -
    getCompleted(),
    0
  );

}


/* ==================================================
   今日
================================================== */

function getTodayCount() {

  return (
    data.history[
      getDateKey()
    ] || 0
  );

}


/* ==================================================
   最初に勉強した日
================================================== */

function getFirstStudyDate() {

  const dates =
    Object.keys(
      data.history
    )
    .filter(
      key =>
        Number(
          data.history[key]
        ) > 0
    )
    .sort();

  return dates.length
    ? dates[0]
    : null;

}


/* ==================================================
   経過日数
================================================== */

function getElapsedDays() {

  const first =
    getFirstStudyDate();

  if (!first) {

    return 0;

  }

  const start =
    new Date(
      first +
      "T00:00:00"
    );

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const diff =
    today.getTime() -
    start.getTime();

  return (
    Math.floor(
      diff /
      (1000 * 60 * 60 * 24)
    ) + 1
  );

}


/* ==================================================
   平均
================================================== */

function getAverage() {

  const days =
    getElapsedDays();

  if (
    days <= 0
  ) {

    return 0;

  }

  return (
    getCompleted() /
    days
  );

}


/* ==================================================
   2問以上の日数
================================================== */

function getGoalDays() {

  let count = 0;

  for (
    const key in data.history
  ) {

    if (
      Number(
        data.history[key]
      ) >= 2
    ) {

      count++;

    }

  }

  return count;

}


/* ==================================================
   必要ペース
================================================== */

function getRequiredRate() {

  const days =
    getDaysRemaining();

  if (
    days <= 0
  ) {

    return getRemaining();

  }

  return (
    getRemaining() /
    days
  );

}


/* ==================================================
   ペース表示
================================================== */

function setPaceResult(
  id,
  perDay
) {

  const days =
    getDaysRemaining();

  const remaining =
    getRemaining();

  const possible =
    perDay *
    days;

  const element =
    document.getElementById(id);


  if (
    possible >= remaining
  ) {

    const surplus =
      Math.floor(
        possible -
        remaining
      );

    element.innerHTML =
      "間に合う<br>＋" +
      surplus +
      "問";

  } else {

    const shortage =
      Math.ceil(
        remaining -
        possible
      );

    element.innerHTML =
      "不足<br>−" +
      shortage +
      "問";

  }

}


/* ==================================================
   全日付
================================================== */

function getAllDates() {

  // 保存済みの過去履歴を必ず含める。
  const dateSet = new Set(
    Object.keys(data.history || {})
  );

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const exam = new Date(
    data.exam +
    "T00:00:00"
  );

  // 今日から試験日前日までを追加
  let current = new Date(today);

  while (current < exam) {
    dateSet.add(getDateKey(current));

    current.setDate(
      current.getDate() + 1
    );
  }

  // 保存済み履歴＋今日以降の日付を日付順に返す
  return Array.from(dateSet).sort();
}


/* ==================================================
   履歴表示
================================================== */

function renderHistory() {

  const container =
    document.getElementById(
      "historyList"
    );

  container.innerHTML =
    "";

  const dates =
    getAllDates();

  dates.reverse();

  let currentMonth =
    "";


  for (
    const key of dates
  ) {

    const month =
      key.substring(
        0,
        7
      );


    if (
      month !==
      currentMonth
    ) {

      currentMonth =
        month;

      const monthTitle =
        document.createElement(
          "div"
        );

      monthTitle.className =
        "month-title";

      monthTitle.textContent =
        Number(
          month.substring(
            5,
            7
          )
        ) +
        "月";

      container.appendChild(
        monthTitle
      );

    }


    const count =
      data.history[key] || 0;


    const row =
      document.createElement(
        "div"
      );

    row.className =
      "history-row";


    const dateDiv =
      document.createElement(
        "div"
      );

    dateDiv.className =
      "history-date";


    const isToday =
      key === getDateKey();


    dateDiv.innerHTML =
      formatDate(key) +
      " " +
      getWeekday(key) +
      "曜日" +
      (
        isToday
          ? "<span>今日</span>"
          : ""
      );


    const input =
      document.createElement(
        "input"
      );

    input.type =
      "number";

    input.min =
      "0";

    input.className =
      "history-input";

    input.id =
      "history-" +
      key;

    input.value =
      count;


    const saveButton =
      document.createElement(
        "button"
      );

    saveButton.className =
      "history-save";

    saveButton.textContent =
      "保存";


    saveButton.onclick =
      function() {

        saveHistory(
          key
        );

      };


    row.appendChild(
      dateDiv
    );

    row.appendChild(
      input
    );

    row.appendChild(
      saveButton
    );

    container.appendChild(
      row
    );

  }

}


/* ==================================================
   履歴修正
================================================== */

function saveHistory(key) {

  const input =
    document.getElementById(
      "history-" +
      key
    );

  const value =
    Number(
      input.value
    );


  if (
    !Number.isFinite(value) ||
    value < 0
  ) {

    alert(
      "0以上の数字を入力してください"
    );

    return;

  }


  data.history[key] =
    Math.floor(value);

  saveData();

  render();

  showMessage(
    formatDate(key) +
    "の記録を保存しました"
  );

}


/* ==================================================
   今日変更
================================================== */

function changeToday(
  amount
) {

  const key =
    getDateKey();

  const current =
    Number(
      data.history[key] || 0
    );


  data.history[key] =
    Math.max(
      current + amount,
      0
    );


  saveData();

  render();

}


/* ==================================================
   今日リセット
================================================== */

function resetToday() {

  const key =
    getDateKey();

  data.history[key] =
    0;

  saveData();

  render();

}


/* ==================================================
   設定保存
================================================== */

function saveSettings() {

  const exam =
    document.getElementById(
      "examInput"
    ).value;

  const initialRemaining =
    Number(
      document.getElementById(
        "remainingInput"
      ).value
    );


  if (!exam) {

    alert(
      "試験日を入力してください"
    );

    return;

  }


  if (
    !Number.isFinite(
      initialRemaining
    ) ||
    initialRemaining < 0
  ) {

    alert(
      "問題数を確認してください"
    );

    return;

  }


  data.exam =
    exam;

  data.initialRemaining =
    Math.floor(
      initialRemaining
    );


  saveData();

  render();

  showMessage(
    "設定を保存しました"
  );

}


/* ==================================================
   メッセージ
================================================== */

function showMessage(text) {

  const element =
    document.getElementById(
      "message"
    );

  element.textContent =
    text;


  setTimeout(
    function() {

      element.textContent =
        "";

    },
    2000
  );

}


/* ==================================================
   長い日付
================================================== */

function formatDateLong(key) {

  const parts =
    key.split("-");

  return (
    parts[0] +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ==================================================
   画面更新
================================================== */

function render() {

  const days =
    getDaysRemaining();

  const completed =
    getCompleted();

  const remaining =
    getRemaining();

  const rate =
    getRequiredRate();

  const today =
    getTodayCount();

  const average =
    getAverage();

  const goalDays =
    getGoalDays();


  document.getElementById(
    "days"
  ).textContent =
    days;


  document.getElementById(
    "remaining"
  ).textContent =
    remaining;


  document.getElementById(
    "completed"
  ).textContent =
    completed;


  document.getElementById(
    "requiredRate"
  ).textContent =
    rate.toFixed(2);


  document.getElementById(
    "today"
  ).textContent =
    today;


  document.getElementById(
    "examDateText"
  ).textContent =
    "試験日：" +
    formatDateLong(
      data.exam
    );


  const total =
    data.initialRemaining;


  const progress =
    total > 0
      ? completed /
        total *
        100
      : 0;


  document.getElementById(
    "progressBar"
  ).style.width =
    Math.min(
      progress,
      100
    ) +
    "%";


  setPaceResult(
    "pace1",
    1
  );

  setPaceResult(
    "pace2",
    2
  );

  setPaceResult(
    "pace3",
    3
  );


  /*
    今日の達成状況

    0問 → まずは1問
    1問 → 最低ライン
    2問 → 目標達成
    3問 → 理想達成
    4問以上 → 目標超過
  */

  const status =
    document.getElementById(
      "status"
    );


  if (
    today >= 4
  ) {

    status.textContent =
      "🔥 " +
      today +
      "問！目標を大幅クリア！";

  } else if (
    today >= 3
  ) {

    status.textContent =
      "🟢 3問！理想達成！今日は大勝ち";

  } else if (
    today >= 2
  ) {

    status.textContent =
      "🟡 2問！目標達成！";

  } else if (
    today >= 1
  ) {

    status.textContent =
      "🔵 1問！最低ライン達成";

  } else {

    status.textContent =
      "まずは1問。";

  }


  document.getElementById(
    "summaryCompleted"
  ).textContent =
    completed;


  document.getElementById(
    "summaryAverage"
  ).textContent =
    average.toFixed(2);


  document.getElementById(
    "summaryGoalDays"
  ).textContent =
    goalDays;


  document.getElementById(
    "summaryNeeded"
  ).textContent =
    rate.toFixed(2);


  const paceStatus =
    document.getElementById(
      "paceStatus"
    );


  if (
    completed === 0
  ) {

    paceStatus.textContent =
      "まずは今日1問から。";

  } else if (
    average >= rate
  ) {

    paceStatus.textContent =
      "🟢 現在の平均ペースなら間に合う見込み。";

  } else {

    const shortage =
      Math.ceil(
        (
          rate -
          average
        ) *
        days
      );

    paceStatus.textContent =
      "🟡 現在の平均ペースだと、約" +
      shortage +
      "問不足する見込み。";

  }


  document.getElementById(
    "examInput"
  ).value =
    data.exam;


  document.getElementById(
    "remainingInput"
  ).value =
    data.initialRemaining;


  document.getElementById(
    "version"
  ).textContent =
    "アプリ v" +
    APP_VERSION;


  renderHistory();

}


/* ==================================================
   起動
================================================== */

saveData();

render();

</script>

</html>
