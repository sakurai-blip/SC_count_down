<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">

<title>支援士カウントダウン</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f7;
  color: #1d1d1f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 28px 16px 50px;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.subtitle {
  color: #86868b;
  font-size: 14px;
  margin-bottom: 6px;
}

.days {
  font-size: 72px;
  line-height: .95;
  font-weight: 800;
  letter-spacing: -4px;
}

.days-label {
  font-size: 18px;
  font-weight: 700;
  margin-top: 8px;
}

.exam-date {
  color: #86868b;
  font-size: 13px;
  margin-top: 7px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.05);
}

.card-title {
  color: #86868b;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
}

.remaining {
  font-size: 38px;
  font-weight: 800;
}

.remaining span {
  font-size: 18px;
  font-weight: 600;
}

.required {
  margin-top: 6px;
  font-size: 14px;
  color: #666;
}

.progress {
  height: 10px;
  background: #e5e5ea;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 15px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #007aff;
  border-radius: 20px;
  transition: width .3s ease;
}

.progress-text {
  margin-top: 8px;
  color: #86868b;
  font-size: 13px;
}

.pace-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.pace {
  background: #f5f5f7;
  border-radius: 15px;
  padding: 13px 5px;
  text-align: center;
}

.pace-number {
  font-size: 25px;
  font-weight: 800;
}

.pace-label {
  font-size: 12px;
  color: #777;
  margin-top: 3px;
}

.pace-result {
  font-size: 12px;
  color: #555;
  margin-top: 7px;
  line-height: 1.4;
}

.today-card {
  text-align: center;
}

.today-number {
  font-size: 58px;
  font-weight: 800;
  line-height: 1;
  margin: 5px 0 12px;
}

.today-label {
  color: #86868b;
  font-size: 13px;
  margin-bottom: 18px;
}

.buttons {
  display: flex;
  gap: 8px;
}

button {
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  padding: 14px;
  cursor: pointer;
}

.add {
  flex: 1;
  background: #007aff;
  color: white;
}

.minus {
  width: 55px;
  background: #e5e5ea;
}

.reset {
  width: 55px;
  background: #e5e5ea;
}

/* サマリー */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.summary-item {
  background: #f5f5f7;
  border-radius: 15px;
  padding: 14px;
}

.summary-number {
  font-size: 25px;
  font-weight: 800;
}

.summary-label {
  color: #86868b;
  font-size: 12px;
  margin-top: 4px;
}

/* ペース状況 */

.pace-status {
  margin-top: 14px;
  padding: 14px;
  border-radius: 14px;
  background: #f5f5f7;
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
  font-weight: 600;
}

/* 履歴 */

.history-header {
  color: #86868b;
  font-size: 12px;
  margin-bottom: 12px;
}

.history-list {
  display: grid;
}

.history-row {
  display: grid;
  grid-template-columns: 1fr 82px 54px;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.history-row:last-child {
  border-bottom: none;
}

.history-date {
  font-size: 14px;
  font-weight: 600;
}

.history-date span {
  display: block;
  color: #999;
  font-size: 11px;
  margin-top: 2px;
}

.history-input {
  width: 82px;
  text-align: center;
  margin: 0;
  padding: 9px 5px;
}

.history-save {
  background: #e5e5ea;
  padding: 9px 5px;
  font-size: 12px;
}

/* 設定 */

.settings {
  display: grid;
  gap: 13px;
}

label {
  display: block;
  color: #666;
  font-size: 13px;
  margin-bottom: 5px;
}

input {
  width: 100%;
  border: 1px solid #d2d2d7;
  border-radius: 12px;
  padding: 13px;
  font-size: 16px;
  background: white;
}

.save {
  width: 100%;
  background: #1d1d1f;
  color: white;
}

.message {
  text-align: center;
  color: #34c759;
  font-size: 13px;
  min-height: 20px;
  margin-top: 10px;
}

.note {
  text-align: center;
  color: #999;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 22px;
}

@media (max-width: 360px) {

  .days {
    font-size: 62px;
  }

  .remaining {
    font-size: 34px;
  }

  .history-row {
    grid-template-columns: 1fr 65px 50px;
  }

  .history-input {
    width: 65px;
  }

}
</style>
</head>


<body>

<div class="container">

  <!-- =========================
       ヘッダー
  ========================== -->

  <div class="header">

    <div class="subtitle">
      情報処理安全確保支援士
    </div>

    <div class="days" id="days">
      --
    </div>

    <div class="days-label">
      試験まで
    </div>

    <div class="exam-date" id="examDateText">
      試験日：----
    </div>

  </div>


  <!-- =========================
       残り問題
  ========================== -->

  <div class="card">

    <div class="card-title">
      午後問題
    </div>

    <div class="remaining">
      <span>残り</span>
      <span id="remaining">140</span>
      <span>問</span>
    </div>

    <div class="required">
      必要ペース：
      <strong id="requiredRate">--</strong>
      問 / 日
    </div>

    <div class="progress">
      <div
        class="progress-bar"
        id="progressBar"
      ></div>
    </div>

    <div class="progress-text">
      完了：
      <strong id="completed">0</strong>
      問
    </div>

  </div>


  <!-- =========================
       ペース
  ========================== -->

  <div class="card">

    <div class="card-title">
      このペースならどうなる？
    </div>

    <div class="pace-grid">

      <div class="pace">

        <div class="pace-number">
          1
        </div>

        <div class="pace-label">
          1問 / 日
        </div>

        <div
          class="pace-result"
          id="pace1"
        >
          --
        </div>

      </div>


      <div class="pace">

        <div class="pace-number">
          2
        </div>

        <div class="pace-label">
          2問 / 日
        </div>

        <div
          class="pace-result"
          id="pace2"
        >
          --
        </div>

      </div>


      <div class="pace">

        <div class="pace-number">
          3
        </div>

        <div class="pace-label">
          3問 / 日
        </div>

        <div
          class="pace-result"
          id="pace3"
        >
          --
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       今日
  ========================== -->

  <div class="card today-card">

    <div class="card-title">
      今日
    </div>

    <div class="today-number">

      <span id="today">
        0
      </span>

      <span style="font-size:22px;">
        問
      </span>

    </div>

    <div class="today-label">
      最低 1問　・　目標 2問　・　理想 3問
    </div>

    <div class="buttons">

      <button
        class="minus"
        onclick="changeToday(-1)"
      >
        −
      </button>

      <button
        class="add"
        onclick="changeToday(1)"
      >
        ＋ 1問やった
      </button>

      <button
        class="reset"
        onclick="resetToday()"
      >
        ↺
      </button>

    </div>

    <div
      class="status"
      id="status"
    >
      まずは1問。
    </div>

  </div>


  <!-- =========================
       学習状況
  ========================== -->

  <div class="card">

    <div class="card-title">
      学習状況
    </div>

    <div class="summary-grid">

      <div class="summary-item">

        <div
          class="summary-number"
          id="summaryCompleted"
        >
          0
        </div>

        <div class="summary-label">
          累計問題数
        </div>

      </div>


      <div class="summary-item">

        <div
          class="summary-number"
          id="summaryAverage"
        >
          0.00
        </div>

        <div class="summary-label">
          1日平均
        </div>

      </div>


      <div class="summary-item">

        <div
          class="summary-number"
          id="summaryGoalDays"
        >
          0
        </div>

        <div class="summary-label">
          目標達成日数
        </div>

      </div>


      <div class="summary-item">

        <div
          class="summary-number"
          id="summaryNeeded"
        >
          --
        </div>

        <div class="summary-label">
          現在の必要ペース
        </div>

      </div>

    </div>


    <div
      class="pace-status"
      id="paceStatus"
    >
      --
    </div>

  </div>


  <!-- =========================
       学習履歴
  ========================== -->

  <div class="card">

    <div class="card-title">
      学習履歴
    </div>

    <div class="history-header">
      今日から試験日までの記録
    </div>

    <div
      class="history-list"
      id="historyList"
    >
    </div>

  </div>


  <!-- =========================
       設定
  ========================== -->

  <div class="card">

    <div class="card-title">
      設定
    </div>

    <div class="settings">

      <div>

        <label for="examInput">
          試験日
        </label>

        <input
          type="date"
          id="examInput"
        >

      </div>


      <div>

        <label for="remainingInput">
          最初の残り問題数
        </label>

        <input
          type="number"
          id="remainingInput"
          min="0"
        >

      </div>


      <button
        class="save"
        onclick="saveSettings()"
      >
        設定を保存
      </button>

    </div>

    <div
      class="message"
      id="message"
    ></div>

  </div>


  <div class="note">
    学習記録はこの端末のブラウザに保存されます。<br>
    サーバーには学習記録を送信しません。
  </div>

</div>


<script>

/* ==================================================
   初期設定
================================================== */

const DEFAULT_EXAM =
  "2026-11-08";

const DEFAULT_REMAINING =
  140;


/* ==================================================
   データ読み込み
================================================== */

let data = {};

try {

  data =
    JSON.parse(
      localStorage.getItem(
        "shien士Countdown"
      )
    ) || {};

} catch (e) {

  data = {};

}


/* ==================================================
   初期値
================================================== */

if (!data.exam) {

  data.exam =
    DEFAULT_EXAM;

}

if (
  typeof data.initialRemaining !==
  "number"
) {

  /*
    以前のバージョンの
    remainingを引き継ぐ
  */

  if (
    typeof data.remaining ===
    "number"
  ) {

    data.initialRemaining =
      data.remaining;

  } else {

    data.initialRemaining =
      DEFAULT_REMAINING;

  }

}

if (!data.history) {

  data.history = {};

}


/* ==================================================
   保存
================================================== */

function saveData() {

  localStorage.setItem(
    "shien士Countdown",
    JSON.stringify(data)
  );

}


/* ==================================================
   日付キー
================================================== */

function getDateKey(
  date = new Date()
) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}


/* ==================================================
   日付表示
================================================== */

function formatDate(
  dateString
) {

  const parts =
    dateString.split("-");

  if (
    parts.length !== 3
  ) {

    return dateString;

  }

  return (
    Number(parts[1]) +
    "/" +
    Number(parts[2])
  );

}


/* ==================================================
   曜日
================================================== */

function getWeekday(
  dateString
) {

  const date =
    new Date(
      dateString +
      "T00:00:00"
    );

  const weekdays =
    [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];

  return weekdays[
    date.getDay()
  ];

}


/* ==================================================
   日数計算
================================================== */

function getDaysRemaining() {

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const exam =
    new Date(
      data.exam +
      "T00:00:00"
    );

  const diff =
    exam.getTime() -
    today.getTime();

  return Math.max(
    Math.ceil(
      diff /
      (1000 * 60 * 60 * 24)
    ),
    0
  );

}


/* ==================================================
   試験までの日付一覧
================================================== */

function getAllDates() {

  const dates = [];

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const exam =
    new Date(
      data.exam +
      "T00:00:00"
    );

  let current =
    new Date(today);


  /*
    今日から試験日まで。
    試験日は履歴入力不要なので
    前日まで表示する。
  */

  while (
    current < exam
  ) {

    dates.push(
      getDateKey(current)
    );

    current.setDate(
      current.getDate() + 1
    );

  }

  return dates;

}


/* ==================================================
   累計問題数
================================================== */

function getCompleted() {

  let total = 0;

  for (
    const key in data.history
  ) {

    const value =
      Number(
        data.history[key]
      );

    if (
      Number.isFinite(value) &&
      value > 0
    ) {

      total +=
        Math.floor(value);

    }

  }

  return total;

}


/* ==================================================
   残り問題数
================================================== */

function getRemaining() {

  return Math.max(
    data.initialRemaining -
    getCompleted(),
    0
  );

}


/* ==================================================
   今日
================================================== */

function getTodayCount() {

  return (
    data.history[
      getDateKey()
    ] || 0
  );

}


/* ==================================================
   経過日数
================================================== */

function getElapsedDays() {

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const startKey =
    Object.keys(
      data.history
    )
    .filter(
      key =>
        data.history[key] > 0
    )
    .sort()[0];

  if (!startKey) {

    return 0;

  }

  const start =
    new Date(
      startKey +
      "T00:00:00"
    );

  const diff =
    today.getTime() -
    start.getTime();

  return (
    Math.floor(
      diff /
      (1000 * 60 * 60 * 24)
    ) + 1
  );

}


/* ==================================================
   実際に勉強した日数
================================================== */

function getStudyDays() {

  let count = 0;

  for (
    const key in data.history
  ) {

    if (
      Number(
        data.history[key]
      ) > 0
    ) {

      count++;

    }

  }

  return count;

}


/* ==================================================
   平均
================================================== */

function getAverage() {

  const days =
    getElapsedDays();

  if (
    days <= 0
  ) {

    return 0;

  }

  return (
    getCompleted() /
    days
  );

}


/* ==================================================
   目標達成日数
================================================== */

function getGoalDays() {

  let count = 0;

  for (
    const key in data.history
  ) {

    if (
      Number(
        data.history[key]
      ) >= 2
    ) {

      count++;

    }

  }

  return count;

}


/* ==================================================
   必要ペース
================================================== */

function getRequiredRate() {

  const days =
    getDaysRemaining();

  const remaining =
    getRemaining();

  if (
    days <= 0
  ) {

    return remaining;

  }

  return (
    remaining /
    days
  );

}


/* ==================================================
   ペース表示
================================================== */

function setPaceResult(
  elementId,
  perDay
) {

  const days =
    getDaysRemaining();

  const remaining =
    getRemaining();

  const possible =
    perDay *
    days;

  const element =
    document.getElementById(
      elementId
    );


  if (
    possible >= remaining
  ) {

    const surplus =
      possible -
      remaining;

    element.innerHTML =
      "間に合う<br>" +
      "＋" +
      surplus +
      "問";

  } else {

    const shortage =
      remaining -
      possible;

    element.innerHTML =
      "不足<br>" +
      "−" +
      shortage +
      "問";

  }

}


/* ==================================================
   履歴表示
================================================== */

function renderHistory() {

  const container =
    document.getElementById(
      "historyList"
    );

  container.innerHTML =
    "";


  const dates =
    getAllDates();


  /*
    新しい日付から表示
  */

  dates.reverse();


  for (
    const key of dates
  ) {

    const count =
      data.history[key] || 0;


    const row =
      document.createElement(
        "div"
      );

    row.className =
      "history-row";


    const dateDiv =
      document.createElement(
        "div"
      );

    dateDiv.className =
      "history-date";


    const isToday =
      key === getDateKey();


    dateDiv.innerHTML =
      formatDate(key) +
      " " +
      getWeekday(key) +
      "曜日" +
      (
        isToday
          ? "<span>今日</span>"
          : ""
      );


    const input =
      document.createElement(
        "input"
      );

    input.type =
      "number";

    input.min =
      "0";

    input.className =
      "history-input";

    input.value =
      count;

    input.id =
      "history-" +
      key;


    const saveButton =
      document.createElement(
        "button"
      );

    saveButton.className =
      "history-save";

    saveButton.textContent =
      "保存";


    saveButton.onclick =
      function() {

        saveHistory(
          key
        );

      };


    row.appendChild(
      dateDiv
    );

    row.appendChild(
      input
    );

    row.appendChild(
      saveButton
    );


    container.appendChild(
      row
    );

  }

}


/* ==================================================
   履歴保存
================================================== */

function saveHistory(
  key
) {

  const input =
    document.getElementById(
      "history-" +
      key
    );

  const newCount =
    Number(
      input.value
    );


  if (
    !Number.isFinite(
      newCount
    ) ||
    newCount < 0
  ) {

    alert(
      "0以上の数字を入力してください"
    );

    return;

  }


  data.history[key] =
    Math.floor(
      newCount
    );


  saveData();

  render();


  showMessage(
    formatDate(key) +
    "の記録を保存しました"
  );

}


/* ==================================================
   今日を変更
================================================== */

function changeToday(
  amount
) {

  const key =
    getDateKey();

  const before =
    data.history[key] || 0;

  const after =
    Math.max(
      before + amount,
      0
    );


  data.history[key] =
    after;


  saveData();

  render();

}


/* ==================================================
   今日をリセット
================================================== */

function resetToday() {

  const key =
    getDateKey();

  data.history[key] =
    0;


  saveData();

  render();

}


/* ==================================================
   設定保存
================================================== */

function saveSettings() {

  const exam =
    document.getElementById(
      "examInput"
    ).value;

  const initialRemaining =
    Number(
      document.getElementById(
        "remainingInput"
      ).value
    );


  if (!exam) {

    alert(
      "試験日を入力してください"
    );

    return;

  }


  if (
    !Number.isFinite(
      initialRemaining
    ) ||
    initialRemaining < 0
  ) {

    alert(
      "残り問題数を確認してください"
    );

    return;

  }


  data.exam =
    exam;

  data.initialRemaining =
    Math.floor(
      initialRemaining
    );


  saveData();

  render();


  showMessage(
    "設定を保存しました"
  );

}


/* ==================================================
   メッセージ
================================================== */

function showMessage(
  text
) {

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;


  setTimeout(
    function() {

      message.textContent =
        "";

    },
    2000
  );

}


/* ==================================================
   画面更新
================================================== */

function render() {

  const days =
    getDaysRemaining();

  const completed =
    getCompleted();

  const remaining =
    getRemaining();

  const rate =
    getRequiredRate();

  const today =
    getTodayCount();

  const average =
    getAverage();

  const goalDays =
    getGoalDays();


  /* 基本 */

  document.getElementById(
    "days"
  ).textContent =
    days;


  document.getElementById(
    "remaining"
  ).textContent =
    remaining;


  document.getElementById(
    "completed"
  ).textContent =
    completed;


  document.getElementById(
    "requiredRate"
  ).textContent =
    rate.toFixed(2);


  document.getElementById(
    "today"
  ).textContent =
    today;


  document.getElementById(
    "examDateText"
  ).textContent =
    "試験日：" +
    formatDateLong(
      data.exam
    );


  /* 進捗 */

  const total =
    data.initialRemaining;

  let progress =
    0;

  if (
    total > 0
  ) {

    progress =
      completed /
      total *
      100;

  }

  document.getElementById(
    "progressBar"
  ).style.width =
    Math.min(
      progress,
      100
    ) +
    "%";


  /* ペース */

  setPaceResult(
    "pace1",
    1
  );

  setPaceResult(
    "pace2",
    2
  );

  setPaceResult(
    "pace3",
    3
  );


  /* 今日の状態 */

  const status =
    document.getElementById(
      "status"
    );


  if (
    today >= 3
  ) {

    status.textContent =
      "🟢 理想達成！今日は大勝ち";

  } else if (
    today >= 2
  ) {

    status.textContent =
      "🟡 目標達成！";

  } else if (
    today >= 1
  ) {

    status.textContent =
      "🔵 最低ライン達成";

  } else {

    status.textContent =
      "まずは1問。";

  }


  /* 学習状況 */

  document.getElementById(
    "summaryCompleted"
  ).textContent =
    completed;


  document.getElementById(
    "summaryAverage"
  ).textContent =
    average.toFixed(2);


  document.getElementById(
    "summaryGoalDays"
  ).textContent =
    goalDays;


  document.getElementById(
    "summaryNeeded"
  ).textContent =
    rate.toFixed(2);


  /* 現在ペース判定 */

  const paceStatus =
    document.getElementById(
      "paceStatus"
    );


  if (
    completed === 0
  ) {

    paceStatus.textContent =
      "まずは今日1問から。";

  } else if (
    average >= rate
  ) {

    const surplus =
      Math.floor(
        (
          average -
          rate
        ) *
        days
      );

    paceStatus.textContent =
      "🟢 現在の平均ペースなら間に合う見込み。 " +
      "このまま淡々と進めよう。";

  } else {

    const shortage =
      Math.ceil(
        (
          rate -
          average
        ) *
        days
      );

    paceStatus.textContent =
      "🟡 現在の平均ペースだと、 " +
      shortage +
      "問ほど不足する見込み。 " +
      "可能な日は2〜3問で取り戻そう。";

  }


  /* 設定 */

  document.getElementById(
    "examInput"
  ).value =
    data.exam;


  document.getElementById(
    "remainingInput"
  ).value =
    data.initialRemaining;


  /* 履歴 */

  renderHistory();

}


/* ==================================================
   長い日付表示
================================================== */

function formatDateLong(
  dateString
) {

  const parts =
    dateString.split("-");

  if (
    parts.length !== 3
  ) {

    return dateString;

  }

  return (
    parts[0] +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ==================================================
   起動
================================================== */

saveData();

render();

</script>
